<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 64">
  <!-- Traditional push pin, side-on: wide cap, narrow waist, wider base collar, steel needle. -->
  <defs>
    <linearGradient id="r" x1="0" x2="1">
      <stop offset="0" stop-color="#0f5a2a"/><stop offset=".3" stop-color="#22a24f"/>
      <stop offset=".45" stop-color="#6fe08f"/><stop offset=".7" stop-color="#1b8a42"/><stop offset="1" stop-color="#0b4a22"/>
    </linearGradient>
    <linearGradient id="n" x1="0" x2="1">
      <stop offset="0" stop-color="#8a909c"/><stop offset=".45" stop-color="#f2f4f8"/><stop offset="1" stop-color="#7a808c"/>
    </linearGradient>
  </defs>
  <path d="M18.8 38 L20 62 L21.2 38 Z" fill="url(#n)"/>
  <!-- base collar -->
  <rect x="9" y="31" width="22" height="7" rx="2" fill="url(#r)"/>
  <ellipse cx="20" cy="31" rx="11" ry="2.6" fill="#7fe39b"/>
  <!-- waist -->
  <rect x="14" y="15" width="12" height="16.5" fill="url(#r)"/>
  <!-- cap -->
  <rect x="6" y="5" width="28" height="11" rx="2.5" fill="url(#r)"/>
  <ellipse cx="20" cy="5.5" rx="14" ry="3.6" fill="#a3efb8"/>
  <ellipse cx="15" cy="4.8" rx="5" ry="1.3" fill="#fff" opacity=".65"/>
</svg>
